services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # No host port mapping: nginx (frontend service) reaches this over the
    # internal Docker network at http://backend:8000 regardless, and a fixed
    # host port would collide the moment a second backend replica starts
    # (`docker compose up --scale backend=N`). For direct host-side debugging,
    # use `docker exec` or a one-off `docker compose port backend 8000`.
    env_file:
      - ./backend/.env
    environment:
      # Park the energy ledger inside an already-mounted volume. Its default
      # (/srv/backend/.energy.db) sits in the container's writable layer, which
      # is discarded on every recreate — so the day's quota spend would reset on
      # each `up --build`, which is the exact failure the SQLite ledger exists to
      # prevent. Set here rather than in backend/.env because the path is
      # container-specific and .env is shared with host-side runs.
      ENERGY_DB_PATH: /srv/backend/app/storage/.energy.db
    depends_on:
      neo4j:
        condition: service_healthy
        required: false
    volumes:
      # models.json is regenerated by model_eval/evaluate.py independently of
      # the app code - mount it so a re-run doesn't require an image rebuild.
      - ./model_eval/models.json:/srv/model_eval/models.json:ro
      # Đảm bảo dữ liệu phân tích và kỹ năng AI học được không bị mất khi restart container
      - ./backend/app/storage:/srv/backend/app/storage
      - ./backend/app/skills:/srv/backend/app/skills
      # Mount Docker socket so the backend container can spawn sibling sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Graph memory: one User-centered graph holding identity (email/name as
  # properties), habits (Action nodes), uploaded Files (fingerprinted),
  # Recipes, and self-learned Skills, connected by relationships so recall is
  # a traversal instead of a join. Optional at the app layer — app/memory/graph.py
  # degrades to a no-op if this service is unreachable.
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me-please}
      # Keep the browser UI off the public network; only bolt is needed by the backend.
      NEO4J_server_http_enabled: "false"
    ports:
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD:-change-me-please}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

volumes:
  neo4j_data:
